# Continuous integration for the CASS platform.
#
# Section 17 asks for CI checks covering unit tests, contracts, container
# builds, security scans and the PiWind baseline. Section 12 adds that a fresh
# environment must be buildable from version-controlled configuration, which is
# what the container-build job proves on every change.

name: platform

on:
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform.yml"]

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: platform

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platform/backend/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -e backend/packages/cass_core \
                      -e backend/packages/cass_oed \
                      -e backend/packages/cass_extract \
                      -e backend/services/keys \
                      -e "backend/services/converter[hdf5]" \
                      -e backend/adapters

      - name: Lint
        run: ruff check backend

      # The converter is installed with its hdf5 extra, which is what the
      # shipped image installs, so the datastore reader and the vectorised
      # binning are covered here rather than skipped until the weekly run.
      # -rs lists whatever still skipped, so a green run says what it did not
      # cover.
      - name: Test
        working-directory: platform/backend
        run: pytest -q -rs --cov --cov-report=term-missing

      # The OpenAPI schema is the contract the React application is written
      # against. Generating it with --fail-on-warn means a viewset that cannot
      # describe itself breaks the build rather than the client.
      - name: Generate the OpenAPI schema
        working-directory: platform/backend/cass_api
        env:
          DJANGO_SETTINGS_MODULE: cass.settings.test
        run: python manage.py spectacular --fail-on-warn --file /tmp/openapi.yaml

      # Section 12: a fresh environment must build from version-controlled
      # configuration. Seeding on a clean database proves the migrations and
      # the demonstration path both still work.
      - name: Seed a clean installation
        working-directory: platform/backend/cass_api
        env:
          DJANGO_SETTINGS_MODULE: cass.settings.test
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.test.utils import setup_test_environment, teardown_test_environment
          from django.test.runner import DiscoverRunner
          from django.core.management import call_command

          setup_test_environment()
          runner = DiscoverRunner(verbosity=0, interactive=False)
          config = runner.setup_databases()
          try:
              call_command("seed_demo", verbosity=1)
          finally:
              runner.teardown_databases(config)
              teardown_test_environment()
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json

      - name: Install
        working-directory: platform/frontend
        run: npm ci

      - name: Lint
        working-directory: platform/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: platform/frontend
        run: npm run typecheck

      - name: Test
        working-directory: platform/frontend
        run: npm run test

      - name: Build
        working-directory: platform/frontend
        run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        image: [api, frontend, keys, converter, oasis-worker]
        include:
          # The patched Oasis worker is built so that raising the upstream
          # version past the patched defect fails here rather than at a run. It
          # is not scanned: its findings are the upstream image's, which this
          # repository cannot fix, and they would fail every build.
          - image: oasis-worker
            scan: false
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: platform
          file: platform/deploy/images/Dockerfile.${{ matrix.image }}
          push: false
          load: true
          tags: cass-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Section 10 requires dependency and image scanning, with a software bill
      # of materials for releases.
      #
      # The tag carries a v. Trivy's action was pinned at 0.29.0 until upstream
      # renamed every tag to a v-prefixed one and deleted the old names, so the
      # job stopped at "Set up job" -- unable to resolve the action -- without
      # running a build or a scan. Pinned to the current release rather than
      # back to the same version under its new name: the scanner is the part of
      # this that goes stale.
      - name: Scan ${{ matrix.image }}
        if: matrix.scan != false
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cass-${{ matrix.image }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Catches a malformed compose file or an unset required variable before
      # anyone tries to bring the stack up.
      - name: Validate the compose file
        run: |
          cp deploy/.env.example .env
          sed -i 's/^CASS_SECRET_KEY=$/CASS_SECRET_KEY=ci-only-not-a-real-secret/' .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only/' .env
          sed -i 's/^MINIO_ROOT_PASSWORD=$/MINIO_ROOT_PASSWORD=ci-only-secret/' .env
          sed -i 's/^OASIS_ADMIN_PASS=$/OASIS_ADMIN_PASS=ci-only/' .env
          docker compose -f deploy/docker-compose.yml --env-file .env config --quiet
          docker compose -f deploy/docker-compose.yml --env-file .env --profile engines config --quiet
