          - approved
          - candidate
          - draft
          - published
          - superseded
          - withdrawn
        description: |-
          * `draft` - Draft
          * `candidate` - Candidate awaiting approval
          * `approved` - Approved
          * `published` - Published
          * `superseded` - Superseded
          * `withdrawn` - Withdrawn
