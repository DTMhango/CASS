openapi: 3.0.3
info:
  title: CASS API
  version: 1.0.0
  description: The control-plane API of CASS, the Catastrophe Analytics and Scenario
    Suite. The React application calls only this API; it never calls OpenQuake or
    Oasis directly.
paths:
  /api/v1/analysis-runs/:
    get:
      operationId: api_v1_analysis_runs_list
      parameters:
      - in: query
        name: exposure_version
        schema:
          type: string
          format: uuid
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: model_version
        schema:
          type: string
          format: uuid
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: run
        schema:
          type: string
          format: uuid
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnalysisRunList'
          description: ''
    post:
      operationId: api_v1_analysis_runs_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRunRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalysisRunRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalysisRunRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
          description: ''
  /api/v1/analysis-runs/{id}/:
    get:
      operationId: api_v1_analysis_runs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this analysis run.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
          description: ''
    put:
      operationId: api_v1_analysis_runs_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this analysis run.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRunRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalysisRunRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalysisRunRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
          description: ''
    patch:
      operationId: api_v1_analysis_runs_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this analysis run.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnalysisRunRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnalysisRunRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnalysisRunRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
          description: ''
    delete:
      operationId: api_v1_analysis_runs_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this analysis run.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/analysis-runs/{id}/request-exception/:
    post:
      operationId: api_v1_analysis_runs_request_exception_create
      description: |-
        Ask a reviewer to let a run held at a gate go on.

        The person whose run is held asks, with a reason; a reviewer who did not
        ask decides. That is the independence rule every gate keeps, applied to
        the gates a run itself reaches. The approvals endpoint could not serve
        it: requesting there is a modeller's act, and the person whose analysis
        is waiting is usually an analyst.

        The request is tagged with the stage it was asked at. A run can reach
        more than one gate, and clearing unmapped value at the keys gate says
        nothing about a loss curve that falls with return period. Asking twice
        returns the request that already stands rather than making a second.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this analysis run.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunExceptionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RunExceptionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RunExceptionRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
          description: ''
  /api/v1/analysis-runs/{id}/resume/:
    post:
      operationId: api_v1_analysis_runs_resume_create
      description: |-
        Put a run whose gate has been cleared back in the queue.

        Resumed from the gate rather than restarted. Everything before it stands
        and its evidence is on the run; redoing it would republish the portfolio
        and leave an orphan on the engine.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this analysis run.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
          description: ''
  /api/v1/analysis-runs/{id}/submit/:
    post:
      operationId: api_v1_analysis_runs_submit_create
      description: |-
        Queue the analysis for execution against Oasis.

        The response is the queued run, not the result. Section 3 asks the run
        monitor to explain progress and failure, so an analyst follows the run
        there rather than holding a request open for the length of a loss
        calculation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this analysis run.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRunRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalysisRunRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalysisRunRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
          description: ''
  /api/v1/approvals/:
    get:
      operationId: api_v1_approvals_list
      parameters:
      - in: query
        name: decision
        schema:
          type: string
          enum:
          - approved
          - rejected
          - requested
          - withdrawn
        description: |-
          * `requested` - Requested
          * `approved` - Approved
          * `rejected` - Rejected
          * `withdrawn` - Withdrawn
      - in: query
        name: gate
        schema:
          type: string
          enum:
          - converter_candidate
          - data_rights
          - exposure_enrichment
          - hazard_candidate
          - model_release
          - platform_release
          - run_exception
          - vulnerability_candidate
        description: |-
          * `hazard_candidate` - Hazard candidate
          * `exposure_enrichment` - Exposure-enrichment candidate
          * `converter_candidate` - Converter candidate
          * `vulnerability_candidate` - Vulnerability candidate
          * `data_rights` - Data-rights gate
          * `model_release` - Model release
          * `platform_release` - Platform release
          * `run_exception` - Permitted run exception
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: subject_id
        schema:
          type: string
          format: uuid
      - in: query
        name: subject_type
        schema:
          type: string
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalList'
          description: ''
    post:
      operationId: api_v1_approvals_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
          description: ''
  /api/v1/approvals/{id}/:
    get:
      operationId: api_v1_approvals_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
          description: ''
    put:
      operationId: api_v1_approvals_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
          description: ''
    patch:
      operationId: api_v1_approvals_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApprovalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApprovalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApprovalRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
          description: ''
    delete:
      operationId: api_v1_approvals_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/approvals/{id}/decide/:
    post:
      operationId: api_v1_approvals_decide_create
      description: |-
        Grant or refuse a gate.

        Independence is enforced: a person may not decide a gate they
        requested, and the role must permit the decision.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
          description: ''
  /api/v1/artifacts/:
    get:
      operationId: api_v1_artifacts_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      - in: query
        name: retention
        schema:
          type: string
          enum:
          - diagnostic
          - hazard_intermediate
          - model_asset
          - operational
          - permanent
          - portfolio
          - result
        description: |-
          * `permanent` - Permanent
          * `model_asset` - Model Asset
          * `hazard_intermediate` - Hazard Intermediate
          * `portfolio` - Portfolio
          * `result` - Result
          * `diagnostic` - Diagnostic
          * `operational` - Operational
      - in: query
        name: role
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - expired
          - pending
          - quarantined
          - registered
        description: |-
          * `pending` - Awaiting upload
          * `registered` - Registered
          * `quarantined` - Quarantined
          * `expired` - Expired
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtifactList'
          description: ''
  /api/v1/artifacts/{id}/:
    get:
      operationId: api_v1_artifacts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artifact.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
  /api/v1/artifacts/{id}/complete/:
    post:
      operationId: api_v1_artifacts_complete_create
      description: |-
        Read back what arrived, and register or quarantine it.

        ``checksum`` and ``size_bytes`` are what the uploader says they sent,
        and both are optional. Where given they are compared with what arrived,
        which is how a truncated or altered upload is caught.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artifact.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
  /api/v1/artifacts/{id}/download/:
    get:
      operationId: api_v1_artifacts_download_retrieve
      description: Stream an artifact after checking entitlement, and record the access.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artifact.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
  /api/v1/artifacts/upload-session/:
    post:
      operationId: api_v1_artifacts_upload_session_create
      description: |-
        Issue a short-lived direct-to-store upload into a project.

        Section 5 has the browser upload large files straight to object
        storage. The caller names the project and the file; this service
        chooses the key, under that project's prefix, so a session can never be
        pointed at somebody else's object.
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
  /api/v1/artifacts/upload/{bucket_name}/{key}:
    put:
      operationId: api_v1_artifacts_upload_update
      description: |-
        Receive an upload's body where the store cannot sign one.

        A filesystem store has no signing authority, so its session URL points
        here. It accepts a body only for a pending upload the caller opened, before
        the session expires -- the same terms a presigned URL enforces on S3 -- and
        registers nothing: completion is still a separate act.
      parameters:
      - in: path
        name: bucket_name
        schema:
          type: string
        required: true
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: Received. Complete the upload to register it.
        '404':
          description: No upload this caller opened is at this address.
        '409':
          description: The upload is no longer accepting content.
        '410':
          description: The upload session has expired.
        '413':
          description: Larger than this installation accepts.
  /api/v1/assumption-sets/:
    get:
      operationId: api_v1_assumption_sets_list
      parameters:
      - in: query
        name: country_code
        schema:
          type: string
      - in: query
        name: flavour
        schema:
          type: string
          enum:
          - baseline
          - more_robust
          - more_vulnerable
        description: |-
          * `baseline` - Baseline
          * `more_robust` - More robust
          * `more_vulnerable` - More vulnerable
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: publication_state
        schema:
          type: string
          enum:
          - approved
          - candidate
          - draft
          - published
          - superseded
          - withdrawn
        description: |-
          * `draft` - Draft
          * `candidate` - Candidate awaiting approval
          * `approved` - Approved
          * `published` - Published
          * `superseded` - Superseded
          * `withdrawn` - Withdrawn
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssumptionSetList'
          description: ''
    post:
      operationId: api_v1_assumption_sets_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssumptionSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssumptionSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssumptionSetRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssumptionSet'
          description: ''
  /api/v1/assumption-sets/{id}/:
    get:
      operationId: api_v1_assumption_sets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this assumption set.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssumptionSet'
          description: ''
    put:
      operationId: api_v1_assumption_sets_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this assumption set.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssumptionSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssumptionSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssumptionSetRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssumptionSet'
          description: ''
    patch:
      operationId: api_v1_assumption_sets_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this assumption set.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssumptionSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssumptionSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssumptionSetRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssumptionSet'
          description: ''
    delete:
      operationId: api_v1_assumption_sets_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this assumption set.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assumptions/:
    get:
      operationId: api_v1_assumptions_retrieve
      description: |-
        The assumptions a promotion may be run under.

        Returned as data rather than hard-coded in the browser, so the interface
        offers exactly what the platform supports and a new scenario appears
        without a frontend release. Every entry says whether an approved prior
        stands behind it, because the difference between a test assumption and an
        approved one is the difference between a research result and a usable one.
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
