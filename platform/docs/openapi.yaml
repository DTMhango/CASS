      enum:
      - create
      - update
      - delete
      - read
      - download
      - upload
      - publish
      - submit
      - cancel
      - retry
      - approve
      - reject
      - override
      - configure
      - sign_in
      - sign_in_failed
      type: string
      description: |-
        * `create` - Created
        * `update` - Updated
        * `delete` - Deleted
        * `read` - Read
        * `download` - Downloaded
        * `upload` - Uploaded
        * `publish` - Published
        * `submit` - Submitted
        * `cancel` - Cancelled
        * `retry` - Retried
        * `approve` - Approved
        * `reject` - Rejected
        * `override` - Overrode a value
        * `configure` - Changed configuration
