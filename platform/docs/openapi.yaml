            application/json:
              schema:
                $ref: '#/components/schemas/GemCatalogue'
          description: ''
  /health/:
    get:
      operationId: health_retrieve
      description: Liveness and readiness, unauthenticated so a probe can reach it.
      tags:
      - health
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /metrics/:
    get:
      operationId: metrics_retrieve
      description: |-
        The scrape endpoint.

        A scraper is not a person with a session, so it presents the token this
        installation configures. Without one configured, only a platform
        administrator may read the metrics: counts of runs and results are not
        business data, but they are not public either.
      tags:
      - metrics
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: Prometheus text format.
        '403':
          description: No scrape token and not an administrator.
components:
