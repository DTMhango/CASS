              $ref: '#/components/schemas/ModelVersionAssemblyRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
          description: ''
