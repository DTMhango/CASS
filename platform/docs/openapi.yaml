          format: date-time
          readOnly: true
      required:
      - country_code
      - created_at
      - id
      - is_frozen
      - source
      - unsupported_imts
      - version
    VulnerabilitySetRequest:
      type: object
      properties:
        country_code:
          type: string
          minLength: 1
          maxLength: 2
        version:
          type: string
          minLength: 1
          maxLength: 32
        source:
          type: string
          minLength: 1
          description: Provenance, such as GEM Global Vulnerability Model v2026.0.0.
          maxLength: 200
        source_commit:
          type: string
          maxLength: 64
        taxonomy_generation:
          type: string
          description: Taxonomy release. Exposure and vulnerability generations must
            match.
          maxLength: 32
        licence:
          type: string
          maxLength: 120
        licence_cleared:
          type: boolean
          description: Cleared under the installation's internal-use basis.
        licence_note:
          type: string
        function_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        imts_used:
          description: Distinct intensity measures the functions demand.
        coverage_components:
          description: Structural, non-structural, contents or business interruption.
        damage_bin_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        assumption_variants:
          description: Assumption set flavour to the rules its function table was
            built under.
        publication_state:
          $ref: '#/components/schemas/PublicationStateEnum'
      required:
      - country_code
      - source
      - version
    VulnerabilitySpecificationRequestRequest:
      type: object
      properties:
        gem:
          type: object
          additionalProperties: {}
        enrichment:
          type: object
          additionalProperties: {}
      required:
      - enrichment
      - gem
    WeightingBasisEnum:
      enum:
      - replacement_cost
      - floor_area
      - building_count
      type: string
      description: |-
        * `replacement_cost` - Replacement cost
        * `floor_area` - Floor area
        * `building_count` - Building count
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
