    PatchedAnalysisRunRequest:
      type: object
      description: |-
        An analysis, and the run that carries it.

        The two are created together rather than separately. A ``Run`` with no
        detail record is a row nothing can execute and nothing can explain, so
        there is no endpoint that makes one on its own: a caller names what the
        analysis should use, and the lifecycle record comes with it.

        The three write-only fields below are the run half of that -- which
        project owns it, what to call it, and the resource envelope of section 11.
      properties:
        exposure_version:
          type: string
          format: uuid
        enrichment_run:
          type: string
          format: uuid
          nullable: true
        assumption_set:
          type: string
          format: uuid
          nullable: true
        model_version:
          type: string
          format: uuid
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          description: |-
            What this analysis is for, and therefore what its output may claim.

            * `geometry_only` - Geometry only, no loss calculated
            * `technical` - KRE-share technical loss
            * `research` - Portfolio-loss research
            * `decision` - Decision use
        perspectives:
          description: Requested perspectives, checked against the source data.
        analysis_settings: {}
        run_currency:
          type: string
          maxLength: 3
        exception_approval:
          type: string
          format: uuid
          nullable: true
          description: The approval that permitted an unreconciled or exceptional
            run to proceed.
        project:
          type: string
          format: uuid
          writeOnly: true
          description: The project that will own the run, its artifacts and its results.
        label:
          type: string
          writeOnly: true
          maxLength: 200
        execution_profile:
          type: string
          writeOnly: true
          maxLength: 32
    PatchedApprovalRequest:
      type: object
      properties:
        gate:
          $ref: '#/components/schemas/GateEnum'
        subject_type:
          type: string
          minLength: 1
          maxLength: 64
        subject_id:
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid
          nullable: true
        rationale:
          type: string
          description: Why the gate was cleared or refused.
        evidence:
          description: Artifact URIs and check results the decision rested on.
    PatchedAreaPerilGridRequest:
      type: object
      properties:
        country_code:
          type: string
          minLength: 1
          maxLength: 2
        version:
          type: string
          minLength: 1
          description: Stable grid version. A change of geometry or mapping logic
            needs a new one.
          maxLength: 32
        label:
          type: string
          minLength: 1
          maxLength: 200
        base_resolution_deg:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,6})?$
        refined_resolution_deg:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,6})?$
        refinement_rule:
          type: string
          minLength: 1
          description: How refined cells are selected, such as exposure density or
            hazard gradient.
        cell_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        excludes_offshore:
          type: boolean
          description: Indonesia's grid should avoid unnecessary calculation points
            over ocean.
        site_condition_source:
          type: string
          description: Provenance of Vs30, soil class and any basin parameters.
          maxLength: 200
        site_condition_fallback:
          type: string
          description: Fallback hierarchy where site parameters are unavailable.
        border_policy:
          type: string
          description: Treatment of locations near national borders and coastlines.
        mapping_tolerance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          description: Distance beyond which a location is reported rather than snapped.
        publication_state:
          $ref: '#/components/schemas/PublicationStateEnum'
        supersedes:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
    PatchedAssumptionSetRequest:
      type: object
      properties:
        country_code:
          type: string
          minLength: 1
          maxLength: 2
        flavour:
          $ref: '#/components/schemas/FlavourEnum'
        version:
          type: string
          minLength: 1
          maxLength: 32
        label:
          type: string
          minLength: 1
          maxLength: 200
        segment:
          type: string
          description: Portfolio segment the set applies to, such as facultative commercial.
          maxLength: 120
        rules: {}
        provenance:
          type: string
          description: Where the priors come from and how they were calibrated.
        weighting_basis:
          allOf:
          - $ref: '#/components/schemas/WeightingBasisEnum'
          description: |-
            Section 8 prefers cost or area weighting over building counts for facultative risks.

            * `replacement_cost` - Replacement cost
            * `floor_area` - Floor area
            * `building_count` - Building count
        publication_state:
          $ref: '#/components/schemas/PublicationStateEnum'
    PatchedConversionRunRequest:
      type: object
