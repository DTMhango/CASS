  /api/v1/portfolio-imports/:
    get:
      operationId: api_v1_portfolio_imports_list
      description: |-
        Importing and profiling a source portfolio extract.

        Read-only as a viewset: a batch is created by uploading a workbook, not by
        posting a record, and nothing about a completed read may be edited
        afterwards. What a person can change is the decision -- accept the batch,
        or review a flagged location -- and those are their own actions.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      - in: query
        name: state
        schema:
          type: string
          enum:
          - accepted
          - parsed
          - rejected
        description: |-
          * `parsed` - Parsed
          * `rejected` - Rejected
          * `accepted` - Accepted
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImportBatchList'
          description: ''
