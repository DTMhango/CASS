    AnalysisRun:
      type: object
      description: |-
        An analysis, and the run that carries it.

        The two are created together rather than separately. A ``Run`` with no
        detail record is a row nothing can execute and nothing can explain, so
        there is no endpoint that makes one on its own: a caller names what the
        analysis should use, and the lifecycle record comes with it.

        The three write-only fields below are the run half of that -- which
        project owns it, what to call it, and the resource envelope of section 11.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        run:
          type: string
          format: uuid
          readOnly: true
        run_detail:
          allOf:
          - $ref: '#/components/schemas/Run'
          readOnly: true
        exposure_version:
          type: string
          format: uuid
        enrichment_run:
          type: string
          format: uuid
          nullable: true
        assumption_set:
          type: string
          format: uuid
          nullable: true
        model_version:
          type: string
          format: uuid
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          description: |-
            What this analysis is for, and therefore what its output may claim.

            * `geometry_only` - Geometry only, no loss calculated
            * `technical` - KRE-share technical loss
            * `research` - Portfolio-loss research
            * `decision` - Decision use
        perspectives:
          description: Requested perspectives, checked against the source data.
        analysis_settings: {}
        run_currency:
          type: string
          maxLength: 3
        oasis_analysis_id:
          type: string
          readOnly: true
        oasis_portfolio_id:
          type: string
          readOnly: true
        keys_summary:
          readOnly: true
        keys_reconciled:
          type: boolean
          readOnly: true
          nullable: true
        may_proceed_past_keys:
          type: boolean
          readOnly: true
        exception_approval:
          type: string
          format: uuid
          nullable: true
          description: The approval that permitted an unreconciled or exceptional
            run to proceed.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - exposure_version
      - id
      - keys_reconciled
      - keys_summary
      - may_proceed_past_keys
      - model_version
      - oasis_analysis_id
      - oasis_portfolio_id
      - run
      - run_detail
    AnalysisRunRequest:
      type: object
      description: |-
        An analysis, and the run that carries it.

        The two are created together rather than separately. A ``Run`` with no
        detail record is a row nothing can execute and nothing can explain, so
