[project]
name = "cass-converter"
version = "0.1.0"
description = "CASS OpenQuake to Oasis converter."
requires-python = ">=3.11"
dependencies = ["cass-core"]

[project.optional-dependencies]
hdf5 = ["h5py>=3.11", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cass_converter*"]
