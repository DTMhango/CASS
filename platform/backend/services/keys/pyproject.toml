[project]
name = "kre-keys"
version = "0.1.0"
description = "KRE keys service: the exposure-to-model lookup boundary."
requires-python = ">=3.11"
dependencies = ["kre-core", "kre-oed"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kre_keys*"]
