[project]
name = "cass-keys"
version = "0.1.0"
description = "CASS keys service: the exposure-to-model lookup boundary."
requires-python = ">=3.11"
dependencies = ["cass-core", "cass-oed"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cass_keys*"]
