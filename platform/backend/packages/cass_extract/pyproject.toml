[project]
name = "cass-extract"
version = "0.1.0"
description = "The KRE geocoded policy extract: parsing, coordinate cohorts and the join report."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cass_extract*"]
