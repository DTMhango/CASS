[project]
name = "cass-extract"
version = "0.1.0"
description = "CASS portfolio intake: the OED-bound template, its reader, and the rules that read it."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cass_extract*"]
