[project]
name = "cass-core"
version = "0.1.0"
description = "CASS shared primitives: artifacts, manifests, run state machine, determinism."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cass_core*"]
