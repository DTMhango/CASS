[project]
name = "kre-oed"
version = "0.1.0"
description = "KRE OED schema subset, validation and publication."
requires-python = ">=3.11"
dependencies = ["kre-core"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kre_oed*"]
