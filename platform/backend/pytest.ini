[pytest]
DJANGO_SETTINGS_MODULE = cass.settings.test
python_files = test_*.py
testpaths = cass_api/tests packages/cass_core/tests packages/cass_oed/tests packages/cass_extract/tests services adapters/tests
pythonpath = cass_api packages/cass_core packages/cass_oed packages/cass_extract services/converter services/keys adapters
addopts = -q --strict-markers -m "not integration"
markers =
    integration: needs a live engine. Deselected by default; run with -m integration.
filterwarnings =
    error::DeprecationWarning:cass_.*
