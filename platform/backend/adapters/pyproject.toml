[project]
name = "cass-adapters"
version = "0.1.0"
description = "CASS engine adapters: the versioned boundary to OpenQuake and Oasis."
requires-python = ">=3.11"
dependencies = ["cass-core", "requests>=2.32"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cass_adapters*"]
