# CASS, the Catastrophe Analytics and Scenario Suite: development and first controlled deployment.
#
# Build plan section 4 makes Docker the common execution boundary from
# development onward, and section 11 requires the same versioned container set
# to serve both a KRE-server installation and an approved local one.
#
# Two things are deliberate here.
#
# Engine containers are unmodified upstream images. Section 10 notes that
# OpenQuake is AGPL-3.0 and the main OasisLMF repository is BSD; keeping the
# engines unmodified and the CASS logic in separate adapter services is the
# design that keeps the licence position simple. Service separation is not a
# substitute for licence analysis, but modifying an engine image would make
# that analysis harder rather than easier.
#
# Images are pinned by tag here and must be pinned by digest before any
# governed deployment. Section 18 requires pinned digests rather than moving
# latest tags, and `make pin-digests` records them.

name: cass-platform

x-artifact-env: &artifact-env
  CASS_ARTIFACT_BACKEND: ${CASS_ARTIFACT_BACKEND:-s3}
  CASS_S3_ENDPOINT: http://minio:9000
  CASS_S3_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-cass-local}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-cass-local-secret}

# Oasis reads configuration from OASIS_<SECTION>_<KEY>. Both the API server and
# the worker need the [celery] result backend: the worker's startup script waits
# on db_host:db_port before it will start at all.
x-oasis-celery-env: &oasis-celery-env
  OASIS_CELERY_BROKER_URL: redis://redis:6379/2
  OASIS_CELERY_DB_ENGINE: db+postgresql
  OASIS_CELERY_DB_HOST: postgres
  OASIS_CELERY_DB_PORT: 5432
  OASIS_CELERY_DB_NAME: ${OASIS_CELERY_DB_NAME:-celery}
  OASIS_CELERY_DB_USER: ${POSTGRES_USER:-cass}
  OASIS_CELERY_DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

# The [server] database keys. The API server and its celery worker must agree
# on these exactly -- they are two processes over one database.
x-oasis-server-env: &oasis-server-env
  OASIS_SERVER_DB_ENGINE: django.db.backends.postgresql
  OASIS_SERVER_DB_HOST: postgres
  OASIS_SERVER_DB_PORT: 5432
  OASIS_SERVER_DB_NAME: ${OASIS_SERVER_DB_NAME:-oasis}
  OASIS_SERVER_DB_USER: ${POSTGRES_USER:-cass}
  OASIS_SERVER_DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-cass.settings.dev}
  CASS_SECRET_KEY: ${CASS_SECRET_KEY:?set CASS_SECRET_KEY in .env}
  CASS_DEBUG: ${CASS_DEBUG:-true}
  CASS_ALLOWED_HOSTS: ${CASS_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  CASS_DB_HOST: postgres
  CASS_DB_NAME: ${POSTGRES_DB:-cass}
  CASS_DB_USER: ${POSTGRES_USER:-cass}
  CASS_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  CASS_BROKER_URL: redis://redis:6379/0
  CASS_RESULT_BACKEND: redis://redis:6379/1
  CASS_OPENQUAKE_URL: http://openquake:8800
  CASS_OASIS_API_URL: http://oasis-api:8000/api
  CASS_OASIS_USERNAME: ${OASIS_ADMIN_USER:-admin}
  CASS_OASIS_PASSWORD: ${OASIS_ADMIN_PASS:?set OASIS_ADMIN_PASS in .env}
  CASS_OASIS_MODEL_SUPPLIER_ID: ${OASIS_MODEL_SUPPLIER_ID:-KRE}
  CASS_OASIS_MODEL_ID: ${OASIS_MODEL_ID:-EQ}
  CASS_OASIS_MODEL_VERSION_ID: ${OASIS_MODEL_VERSION_ID:-1}
  CASS_KEYS_SERVICE_URL: http://keys:8010
  CASS_CONVERTER_URL: http://converter:8020
  CASS_CORS_ORIGINS: ${CASS_CORS_ORIGINS:-http://localhost:5173}
  CASS_CSRF_TRUSTED_ORIGINS: ${CASS_CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
  # Uploads and their scanning. An empty clamd host means none is configured,
  # which each registered upload records rather than implying a scan.
  CASS_MAX_UPLOAD_BYTES: ${CASS_MAX_UPLOAD_BYTES:-536870912}
  CASS_UPLOAD_SESSION_SECONDS: ${CASS_UPLOAD_SESSION_SECONDS:-900}
  CASS_CLAMD_HOST: ${CASS_CLAMD_HOST:-}
  CASS_CLAMD_PORT: ${CASS_CLAMD_PORT:-3310}
  # The scrape token for /metrics/. Empty leaves the metrics to administrators.
  CASS_METRICS_TOKEN: ${CASS_METRICS_TOKEN:-}

services:
  # -- control plane -------------------------------------------------------
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cass}
      POSTGRES_USER: ${POSTGRES_USER:-cass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the Oasis server and celery-result databases on a fresh volume.
      # Postgres only runs these on first initialisation, which is the right
      # semantics: they are part of standing an installation up, not of every
      # restart.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cass} -d ${POSTGRES_DB:-cass}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host by default: the control-plane database is
    # reachable only from the compose network.
    expose:
      - "5432"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "6379"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cass-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cass-local-secret}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the buckets section 5 separates by purpose and retention, then
  # exits. Bucket creation is idempotent, so a restart is harmless.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cass-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cass-local-secret}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        for bucket in cass-upload cass-portfolio cass-model cass-hazard cass-result; do
          mc mb --ignore-existing "local/$$bucket"
          mc anonymous set none "local/$$bucket"
        done
        echo "CASS buckets ready"
    restart: "no"

  api:
    # One image for the API, the worker and the scheduler. They run the same
    # code, and separate tags let a build of one leave the others behind: a
    # worker on a stale image refuses tasks the API has just started sending.
    image: cass/platform-api:local
    build:
      context: ..
      dockerfile: deploy/images/Dockerfile.api
    environment:
      <<: [*django-env, *artifact-env]
    volumes:
      # The GEM clones and the national hazard packages are licensed and
      # outside version control, so they are mounted read-only rather than
      # baked into an image. The management commands take paths under /models.
      - ${CASS_MODELS_PATH:-../../models}:/models:ro
      # Where an assembled Oasis model package is written. The Oasis worker
      # mounts the same volume read-only as its model root, so building a
      # package and serving it are two views of one directory.
      - oasis-model:/oasis-model
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${CASS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Durable background execution. Section 11 requires declared limits rather
  # than inherited maximum parallelism, so concurrency is set explicitly and
  # the worker prefetches one task at a time.
  worker:
    image: cass/platform-api:local
    build:
      context: ..
      dockerfile: deploy/images/Dockerfile.api
    command:
      - celery
      - -A
      - cass
      - worker
      - --loglevel=INFO
      - --concurrency=${CASS_WORKER_CONCURRENCY:-2}
      - --prefetch-multiplier=1
      - --max-tasks-per-child=20
    environment:
      <<: [*django-env, *artifact-env]
    volumes:
      # The GEM clones and the national hazard packages are licensed and
      # outside version control, so they are mounted read-only rather than
      # baked into an image. The management commands take paths under /models.
      - ${CASS_MODELS_PATH:-../../models}:/models:ro
      # Where an assembled Oasis model package is written. The Oasis worker
      # mounts the same volume read-only as its model root, so building a
      # package and serving it are two views of one directory.
      - oasis-model:/oasis-model
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL, not CMD: the exec form runs without a shell, so $$HOSTNAME
      # would be pinged literally and the check would always fail while the
      # worker was in fact healthy.
      test: ["CMD-SHELL", "celery -A cass inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # The scheduler. Retention expiry and abandoning stale runs are decisions the
  # platform takes on a clock rather than when somebody presses something, and
  # a policy nothing enforces is not a policy. One replica only: two beats
  # would issue every scheduled task twice.
  beat:
    image: cass/platform-api:local
    build:
      context: ..
      dockerfile: deploy/images/Dockerfile.api
    command:
      - celery
      - -A
      - cass
      - beat
      - --loglevel=INFO
    environment:
      <<: [*django-env, *artifact-env]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/images/Dockerfile.frontend
      args:
        CASS_API_ORIGIN: ${CASS_API_ORIGIN:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CASS_WEB_PORT:-8080}:8080"

  # -- CASS engine-adjacent services ---------------------------------------
  # The keys service and the converter are CASS product components, not engine
  # forks. They are separate containers so the converter can be given a
  # model-build resource profile without that applying to the whole API.
  keys:
    build:
      context: ..
      dockerfile: deploy/images/Dockerfile.keys
    environment:
      <<: *artifact-env
      CASS_KEYS_PORT: "8010"
    expose:
      - "8010"
    profiles: ["engines"]

  converter:
    build:
      context: ..
      dockerfile: deploy/images/Dockerfile.converter
    environment:
      <<: *artifact-env
    expose:
      - "8020"
    # Section 11 separates the model-build profile from the portfolio-analysis
    # one: a country-scale conversion needs memory an analysis does not.
    deploy:
      resources:
        limits:
          memory: ${CASS_CONVERTER_MEMORY:-16G}
    profiles: ["engines"]

  # -- upstream engines ----------------------------------------------------
  # Unmodified upstream images. CASS reaches them through adapters over their
  # supported APIs; it never writes to their internal stores.
  openquake:
    # Docker Hub, not ghcr.io/gem/oq-engine, which this project pinned until a
    # pull found it inaccessible without credentials. The 3.23 tag currently
    # resolves to 3.23.4; the engine version is recorded on every hazard set,
    # so a conversion always names the build that produced it.
    image: openquake/engine:3.23
    # One string, not a list. The image's entrypoint is ``/bin/bash -c``, which
    # takes only its first argument as the script: the list form ran ``oq``
    # with no subcommand, printed its usage and exited 0 -- a container that
    # "started" and was never listening.
    command: ["oq webui start 0.0.0.0:8800 -s"]
    volumes:
      - openquake-data:/home/openquake/oqdata
    expose:
      - "8800"
    profiles: ["engines"]

  oasis-api:
    image: coreoasis/api_server:2.5.7
    environment:
      <<: [*oasis-celery-env, *oasis-server-env]
      OASIS_ADMIN_USER: ${OASIS_ADMIN_USER:-admin}
      OASIS_ADMIN_PASS: ${OASIS_ADMIN_PASS:?set OASIS_ADMIN_PASS in .env}
      # The server's startup script only migrates its database when this is
      # true. Without it the container comes up against an empty schema and
      # fails creating the administrator, with "auth_user does not exist".
      STARTUP_RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - oasis-data:/shared-fs
    expose:
      - "8000"
    profiles: ["engines"]

  oasis-worker:
    # The official worker with one upstream defect patched at build time; the
    # Dockerfile says which and why.
    build:
      context: ..
      dockerfile: deploy/images/Dockerfile.oasis-worker
    image: cass/model_worker:2.5.7-patched
    environment:
      <<: *oasis-celery-env
      # The queue the worker consumes is named from this triple, and the API
      # publishes to the same name, so a mismatch here is a job that is
      # accepted and never picked up.
      OASIS_MODEL_SUPPLIER_ID: ${OASIS_MODEL_SUPPLIER_ID:-KRE}
      OASIS_MODEL_ID: ${OASIS_MODEL_ID:-EQ}
      OASIS_MODEL_VERSION_ID: ${OASIS_MODEL_VERSION_ID:-1}
      # v1 is the single-server task set: the worker takes a job off its own
      # queue and runs it through. That matches the deployment section 2
      # specifies -- KRE servers or an approved local Docker installation.
      #
      # v2 is the distributed, chunked task set. It needs an orchestration
      # worker consuming the API's own celery-v2 queues, which this compose
      # does not run: set it and analyses queue forever with no sub-tasks.
      # The worker refuses to start if this is unset entirely.
      OASIS_RUN_MODE: ${OASIS_RUN_MODE:-v1}
      # The image's own conf.ini ships LOG_LEVEL = DEBUG, and that level reaches
      # the loss kernel. oasislmf 2.5.7's financial module raises IndexError
      # while formatting one of its debug messages (pytools/fm/stream_sparse.py
      # event_log_msg), which kills an insured or reinsurance run that was
      # calculating correctly. Ground-up never reaches that code, so the failure
      # looks like the financial terms rather than the log level.
      OASIS_LOG_LEVEL: ${OASIS_LOG_LEVEL:-INFO}
    depends_on:
      oasis-api:
        condition: service_started
    volumes:
      - oasis-data:/shared-fs
      # The worker's conf.ini sets MODEL_DATA_DIRECTORY=/home/worker/model and
      # reads meta-data/model_settings.json beneath it, so the mount is the
      # model root -- model_data/, keys_data/, meta-data/ and oasislmf.json --
      # not the model_data directory alone.
      # The package CASS builds and deploys, by default. Point
      # CASS_MODEL_DATA_PATH at a model root on disk -- PiWind, for the live
      # integration suite -- to serve that instead.
      - ${CASS_MODEL_DATA_PATH:-oasis-model}:/home/worker/model:ro
    profiles: ["engines"]

  # The API server's celery worker, and the service this stack was missing.
  #
  # Gunicorn serves requests; it does not consume a queue. Without this, a
  # model worker takes a job, finishes it, and nothing ever records the result:
  # the worker log says input generation completed while the analysis sits at
  # INPUTS_GENERATION_QUEUED forever. It is also what consumes a model worker's
  # registration broadcast, so without it a model never appears in the API and
  # the first analysis is refused with "'run_mode' must not be null" -- which
  # reads as a bad request rather than as a missing service.
  #
  # It reuses the API image so the startup script's database waits apply, with
  # migrations left to the API server so two processes do not race one schema.
  oasis-celery:
    image: coreoasis/api_server:2.5.7
    environment:
      <<: [*oasis-celery-env, *oasis-server-env]
    command:
      - celery
      - --app
      - src.server.oasisapi.celery_app_v1:v1
      - worker
      - --loglevel=INFO
      - --queues=celery
    depends_on:
      oasis-api:
        condition: service_started
    volumes:
      - oasis-data:/shared-fs
    profiles: ["engines"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  openquake-data:
  oasis-data:
  oasis-model:
